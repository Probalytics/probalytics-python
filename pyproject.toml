[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "probalytics"
version = "0.1.0"
description = "Python client for Probalytics market, fill, and orderbook data"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Probalytics" },
]
maintainers = [
    { name = "Probalytics" },
]
keywords = [
    "clickhouse",
    "market-data",
    "polars",
    "prediction-markets",
    "probalytics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "clickhouse-driver>=0.2.10",
    "polars>=1",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/Probalytics/probalytics-python"
Repository = "https://github.com/Probalytics/probalytics-python"
Issues = "https://github.com/Probalytics/probalytics-python/issues"

[project.optional-dependencies]
pandas = [
    "pandas>=2",
]
test = [
    "pandas>=2",
    "pytest>=8",
    "testcontainers>=4.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that start Docker containers or use external services",
]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/src",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/probalytics"]
